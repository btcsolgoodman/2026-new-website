name: Notion CMS Sync

on:
  # 매 5분마다 자동 실행
  schedule:
    - cron: '*/5 * * * *'
  # GitHub UI에서 수동 실행 가능
  workflow_dispatch:
  # main 푸시 시에도 한 번 실행 (배포 시 최신 데이터 보장)
  push:
    branches: [main]
    paths:
      - 'scripts/notion-sync.js'
      - '.github/workflows/notion-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/notion-sync.js

      - name: Commit changes if any
        run: |
          git config user.name "SEMIAN Sync Bot"
          git config user.email "bot@semian.co.kr"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes — Notion data unchanged."
          else
            git commit -m "🔄 Notion CMS sync ($(date -u +%Y-%m-%d\ %H:%M\ UTC))"
            git push
          fi
